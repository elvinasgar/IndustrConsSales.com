<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kabinetim — IndustrCons Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container" style="padding-top:var(--sp-5);padding-bottom:var(--sp-8);">
  <h1 style="font-size:1.7rem;">Xoş gəldiniz, <span id="user-name"></span></h1>

  <div class="dash-layout" style="margin-top:var(--sp-4);">
    <nav class="dash-nav">
      <a href="dashboard.html" class="active">📊 İcmal</a>
      <a href="my-listings.html">📋 Elanlarım</a>
      <a href="messages.html">💬 Mesajlar</a>
      <a href="favorites.html">♡ Sevimlilər</a>
      <a href="#">🔔 Bildirişlər</a>
      <a href="#">💰 Satışlar</a>
      <a href="#">🛍 Alışlar</a>
      <a href="#">👤 Profil</a>
      <a href="security.html">🛡 Təhlükəsizlik</a>
    </nav>

    <div>
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-num" id="stat-views"></div><div class="stat-label">Baxış</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-favs"></div><div class="stat-label">Sevimli</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-leads"></div><div class="stat-label">Lead</div></div>
        <div class="stat-card"><div class="stat-num" id="stat-active"></div><div class="stat-label">Aktiv elan</div></div>
      </div>

      <div class="flex justify-between items-center" style="margin-bottom:var(--sp-3);">
        <h2 style="margin:0;">Son elanlarım</h2>
        <a href="post-listing.html" class="btn btn-primary btn-sm">+ Elan yerləşdir</a>
      </div>
      <table class="table" style="margin-bottom:var(--sp-6);">
        <thead><tr><th>Elan</th><th>Qiymət</th><th>Status</th><th>Baxış</th><th></th></tr></thead>
        <tbody id="listings-table-body"></tbody>
      </table>

      <h2>Satış boru xətti (CRM)</h2>
      <p class="muted">Alıcılarla danışıqların vəziyyətini izləyin.</p>
      <div class="pipeline" id="pipeline"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/listings.js"></script>
<script src="js/auth.js"></script>
<script>
  const user = getUser();
  document.getElementById("user-name").textContent = user.name;
  document.getElementById("stat-views").textContent = icPrice(user.stats.views);
  document.getElementById("stat-favs").textContent = icPrice(user.stats.favorites);
  document.getElementById("stat-leads").textContent = user.stats.leads;
  document.getElementById("stat-active").textContent = user.stats.activeListings;

  const myListings = [...IC_PROPERTY.slice(0,2), ...IC_EQUIPMENT.slice(0,2), ...IC_MARKETPLACE.slice(0,1)];
  const statuses = ["status-active","status-pending","status-active","status-rejected","status-sold"];
  const statusLabels = ["Aktiv","Gözləmədə","Aktiv","Rədd edilib","Satıldı"];
  document.getElementById("listings-table-body").innerHTML = myListings.map((l,i)=>`
    <tr>
      <td><a href="${l.kind==='property'?'property-detail.html':'product-detail.html'}?id=${l.id}">${l.title}</a></td>
      <td>${icPrice(l.price ?? l.salePrice)} AZN</td>
      <td><span class="status-pill ${statuses[i]}">${statusLabels[i]}</span></td>
      <td>${icPrice(l.views)}</td>
      <td><a href="post-listing.html" class="muted">Redaktə</a></td>
    </tr>`).join("");

  const pipeline = [
    { stage:"NEW", leads:[{name:"Ali",listing:"JCB 3CX",time:"Bu gün"}] },
    { stage:"CONTACTED", leads:[{name:"Rəşad",listing:"3 otaqlı mənzil",time:"Dünən"}] },
    { stage:"MEETING", leads:[{name:"Günel",listing:"MacBook Air M2",time:"2 gün əvvəl"}] },
    { stage:"NEGOTIATION", leads:[{name:"Ali",listing:"JCB 3CX",time:"Bu gün"},{name:"Tural",listing:"Beton mikseri",time:"3 gün əvvəl"}] },
    { stage:"SOLD", leads:[{name:"Nərmin",listing:"Ofis sahəsi",time:"1 həftə əvvəl"}] },
  ];
  document.getElementById("pipeline").innerHTML = pipeline.map(col=>`
    <div class="pipeline-col">
      <h4>${col.stage}</h4>
      ${col.leads.map(l=>`<div class="lead-card"><div class="lead-name">${l.name}</div><div class="lead-meta">${l.listing}</div><div class="lead-meta">${l.time}</div></div>`).join("") || '<p class="muted" style="font-size:0.8rem;padding:0 8px;">Boş</p>'}
    </div>
  `).join("");
</script>
</body>
</html>
