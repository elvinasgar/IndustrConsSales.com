<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elanlarım — IndustrCons Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container" style="padding-top:var(--sp-5);padding-bottom:var(--sp-8);">
  <div class="dash-layout">
    <nav class="dash-nav">
      <a href="dashboard.html">📊 İcmal</a>
      <a href="my-listings.html" class="active">📋 Elanlarım</a>
      <a href="messages.html">💬 Mesajlar</a>
      <a href="favorites.html">♡ Sevimlilər</a>
      <a href="security.html">🛡 Təhlükəsizlik</a>
    </nav>
    <div>
      <div class="flex justify-between items-center" style="margin-bottom:var(--sp-4);">
        <h1 style="font-size:1.6rem;margin:0;">Elanlarım</h1>
        <a href="post-listing.html" class="btn btn-primary btn-sm">+ Yeni elan</a>
      </div>
      <table class="table">
        <thead><tr><th>Elan</th><th>Referans</th><th>Status</th><th>Tarix</th></tr></thead>
        <tbody id="drafts-body"></tbody>
      </table>
      <div style="height:var(--sp-5);"></div>
      <h2>Aktiv elanlar</h2>
      <div class="grid" id="active-grid"></div>
    </div>
  </div>
</main>

<div id="site-footer"></div>
<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/listings.js"></script>
<script>
  const drafts = getMyDraftListings();
  document.getElementById("drafts-body").innerHTML = drafts.length ? drafts.map(d=>`
    <tr><td>${d.title}</td><td>${d.id}</td><td><span class="status-pill status-pending">PENDING</span></td><td>${icTimeAgo(d.createdAt)}</td></tr>
  `).join("") : `<tr><td colspan="4" class="muted">Hələ göndərilmiş elan yoxdur. <a href="post-listing.html">Elan yerləşdirin</a>.</td></tr>`;

  icRenderCards("active-grid", [...IC_PROPERTY.slice(0,2), ...IC_EQUIPMENT.slice(0,2)]);
</script>
</body>
</html>
