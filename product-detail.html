<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="page-title">Məhsul — IndustrCons Market</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>

<main class="container" style="padding-top:var(--sp-5);">
  <div class="breadcrumb" id="breadcrumb"></div>
  <div id="gallery" class="gallery"></div>

  <div class="detail-layout">
    <div>
      <div class="flex items-center gap-2" style="margin:var(--sp-4) 0 var(--sp-2);flex-wrap:wrap;" id="badge-row"></div>
      <h1 id="detail-title" style="font-size:1.8rem;"></h1>
      <div class="card-price" id="detail-price" style="font-size:1.6rem;margin-bottom:var(--sp-2);"></div>
      <div class="card-price" id="detail-rent-price" style="font-size:1rem;color:var(--ink-soft);margin-bottom:var(--sp-2);"></div>
      <div class="muted" id="detail-loc">📍</div>

      <div class="spec-grid" id="spec-grid"></div>

      <h3>Təsvir</h3>
      <p id="detail-desc"></p>
      <div id="rental-note"></div>

      <div class="alert alert-warning" style="margin-top:var(--sp-4);">
        <span>⚠️</span>
        <div><b>Təhlükəsizlik xəbərdarlığı</b>IndustrCons heç vaxt sizdən SMS/OTP kodu, PIN və CVV tələb etmir.</div>
      </div>

      <div class="flex gap-2" style="margin-top:var(--sp-4);">
        <button class="btn btn-outline btn-sm" id="report-btn">🚩 Şikayət et</button>
        <button class="btn btn-outline btn-sm" id="share-btn">↗ Paylaş</button>
        <button class="btn btn-outline btn-sm" id="save-btn">♡ Yadda saxla</button>
      </div>
    </div>

    <aside>
      <div class="seller-card" id="seller-card"></div>
    </aside>
  </div>

  <section class="section">
    <h2>Oxşar elanlar</h2>
    <div class="grid" id="related-grid"></div>
  </section>
</main>

<div id="site-footer"></div>

<div class="modal-overlay" id="report-modal">
  <div class="modal-box">
    <button class="modal-close" id="close-report">&times;</button>
    <h3>Elanı şikayət et</h3>
    <div class="form-group">
      <label>Səbəb</label>
      <select id="report-reason">
        <option>Scam</option><option>Fake listing</option><option>Wrong price</option>
        <option>Stolen image</option><option>Illegal item</option><option>Spam</option>
        <option>Harassment</option><option>Phishing</option><option>Other</option>
      </select>
    </div>
    <button class="btn btn-danger btn-block" id="submit-report">Göndər</button>
  </div>
</div>

<script src="js/mock-data.js"></script>
<script src="js/app.js"></script>
<script src="js/listings.js"></script>
<script src="js/security.js"></script>
<script>
  const id = icQueryParam("id") || IC_MARKETPLACE[0].id;
  const item = findListingById(id) || IC_MARKETPLACE[0];
  const isEquipment = item.kind === "equipment";
  const catPage = isEquipment ? "equipment.html" : "marketplace.html";
  const catLabel = isEquipment ? "Texnika" : "Marketplace";

  document.getElementById("page-title").textContent = `${item.title} — IndustrCons Market`;
  document.getElementById("breadcrumb").innerHTML = `<a href="index.html">Home</a> / <a href="${catPage}">${catLabel}</a> / ${item.title}`;
  document.getElementById("detail-title").textContent = item.title;
  document.getElementById("detail-loc").textContent = `📍 ${item.location}, ${item.city}`;
  document.getElementById("detail-desc").textContent = item.description;

  document.getElementById("badge-row").innerHTML = `
    ${item.premium ? '<span class="tag tag-premium">⭐ PREMIUM</span>' : ''}
    ${isEquipment ? (item.forSale?'<span class="tag tag-new">Satılır</span>':'') + (item.forRent?'<span class="tag tag-rent">İcarə</span>':'') : `<span class="tag ${item.status==='Yeni'?'tag-new':'tag-used'}">${item.status}</span>`}
  `;

  if(isEquipment){
    document.getElementById("detail-price").textContent = item.forSale ? `${icPrice(item.salePrice)} AZN` : "";
    document.getElementById("detail-rent-price").textContent = item.forRent ? `İcarə: ${icPrice(item.rentPrice)} ${item.rentUnit}` : "";
    document.getElementById("spec-grid").innerHTML = [
      ["İl", item.year], ["Yanacaq", item.fuel], ["Ötürücü", item.drive || "—"],
      ["Motosaat", item.hours], ["Kateqoriya", item.category]
    ].map(([l,v])=>`<div class="spec-item"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("");
    if(item.forRent) document.getElementById("rental-note").innerHTML = `<div class="alert alert-success">✓ Bu avadanlıq gündəlik icarəyə verilir. Çatdırılma seçimi barədə satıcı ilə əlaqə saxlayın.</div>`;
  } else {
    document.getElementById("detail-price").textContent = `${icPrice(item.price)} ${item.priceUnit}`;
    if(item.rentPrice) document.getElementById("detail-rent-price").textContent = `İcarə: ${icPrice(item.rentPrice)} AZN/gün`;
    document.getElementById("spec-grid").innerHTML = Object.entries(item.specs || {}).map(([l,v])=>`<div class="spec-item"><div class="label">${l}</div><div class="value">${v}</div></div>`).join("")
      + `<div class="spec-item"><div class="label">Kateqoriya</div><div class="value">${item.category}</div></div>`;
  }

  document.getElementById("gallery").innerHTML = `
    <div class="main-img"><img id="main-gallery-img" src="${item.images[0]}" alt="${item.title}"></div>
    <div class="thumb-col">${item.images.slice(1,3).map(src=>`<div><img src="${src}"></div>`).join("")}</div>
  `;
  document.querySelectorAll(".thumb-col img").forEach(t=>{
    t.addEventListener("click", ()=> document.getElementById("main-gallery-img").src = t.src);
  });

  const s = item.seller;
  document.getElementById("seller-card").innerHTML = `
    <div class="seller-top">
      <div class="avatar">${s.name.charAt(0)}</div>
      <div>
        <div style="font-weight:700;">${s.name}</div>
        ${s.verified ? '<span class="verified-badge">'+ICON.check+' Verified Business</span>' : '<span class="muted" style="font-size:0.8rem;">Şəxsi satıcı</span>'}
      </div>
    </div>
    <div class="rating">★ ${s.rating} · ${s.reviews} rəy</div>
    <div class="detail-actions">
      <button class="btn btn-dark btn-block" onclick="location.href='messages.html'">Mesaj göndər</button>
    </div>
    <button class="btn btn-outline btn-block" style="margin-top:8px;" id="show-phone">Telefonu göstər</button>
  `;
  document.getElementById("show-phone").addEventListener("click", (e)=>{ e.target.textContent = "+994 50 " + icRand(100,999) + " " + icRand(10,99) + " " + icRand(10,99); e.target.disabled = true; });

  const pool = isEquipment ? IC_EQUIPMENT : IC_MARKETPLACE;
  icRenderCards("related-grid", pool.filter(p=>p.id!==item.id && p.category===item.category).slice(0,4));

  document.getElementById("report-btn").addEventListener("click", ()=> document.getElementById("report-modal").classList.add("open"));
  document.getElementById("close-report").addEventListener("click", ()=> document.getElementById("report-modal").classList.remove("open"));
  document.getElementById("submit-report").addEventListener("click", ()=>{
    const res = reportListing(item.id, document.getElementById("report-reason").value);
    document.getElementById("report-modal").classList.remove("open");
    icToast(`Təşəkkürlər. Şikayət ID: ${res.reference}`, "success");
  });
  document.getElementById("share-btn").addEventListener("click", ()=> icToast("Keçid kopyalandı"));
  document.getElementById("save-btn").addEventListener("click", ()=> icToggleFavorite(item.id));
</script>
</body>
</html>
